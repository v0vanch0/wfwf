name: Build Cline DeepSeek Max

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Cline Desktop v0.0.36
        uses: actions/checkout@v4
        with:
          repository: cline/cline
          ref: desktop-v0.0.36
          path: cline

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Seed Bun cache with Linux remote-helper runtimes
        shell: bash
        run: |
          BUN_VERSION="$(bun --version)"
          CACHE_DIR="${RUNNER_TEMP//\\//}/bun-install-cache"
          mkdir -p "$CACHE_DIR"
          for target in linux-x64-baseline linux-aarch64; do
            dest="$CACHE_DIR/bun-$target-v$BUN_VERSION"
            work="$(mktemp -d)"
            (cd "$work" && npm pack "@oven/bun-$target@$BUN_VERSION" --silent >/dev/null && tar -xzf ./*.tgz package/bin/bun)
            mv "$work/package/bin/bun" "$dest"
            echo "seeded $dest"
          done
          echo "BUN_INSTALL_CACHE_DIR=${CACHE_DIR}" >> "$GITHUB_ENV"

      - name: Install UPX
        shell: pwsh
        run: choco install upx --no-progress -y

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Patch DeepSeek max reasoning
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          backend = Path("cline/sdk/packages/llms/src/providers/vendors/openai-compatible.ts")
          text = backend.read_text(encoding="utf-8")

          marker = "function isOpenRouterImageGenerationRequest(input: FetchInput): boolean {"
          helper = '''export function withDeepSeekMaxReasoning(\n\tbody: Record<string, unknown>,\n): Record<string, unknown> {\n\tif (body.reasoning_effort !== "xhigh") {\n\t\treturn body;\n\t}\n\treturn { ...body, reasoning_effort: "max" };\n}\n\n'''
          if marker not in text:
              raise SystemExit("backend insertion marker not found")
          text = text.replace(marker, helper + marker, 1)

          provider_marker = "\tconst provider = createOpenAICompatible({"
          transform = '''\tconst transformRequestBody = (body: Record<string, unknown>) => {\n\t\tconst normalizedBody = withMaxCompletionTokensForReasoningModels(body);\n\t\treturn context.provider.id === "deepseek"\n\t\t\t? withDeepSeekMaxReasoning(normalizedBody)\n\t\t\t: normalizedBody;\n\t};\n'''
          if provider_marker not in text:
              raise SystemExit("provider marker not found")
          text = text.replace(provider_marker, transform + provider_marker, 1)

          old_transform = "\t\ttransformRequestBody: withMaxCompletionTokensForReasoningModels,"
          if old_transform not in text:
              raise SystemExit("transformRequestBody marker not found")
          text = text.replace(old_transform, "\t\ttransformRequestBody,", 1)
          backend.write_text(text, encoding="utf-8")

          ui = Path("cline/apps/examples/desktop-app/webview/components/views/chat/chat-input-bar.tsx")
          text = ui.read_text(encoding="utf-8")
          ui_marker = "const PROMPT_INPUT_COLLAPSED_ROWS = 1;"
          ui_helper = '''function getEffortLabel(\n\toption: ReasoningEffortOption | undefined,\n\tprovider: string,\n): string {\n\tif (\n\t\toption?.value === "xhigh" &&\n\t\tnormalizeProviderId(provider) === "deepseek"\n\t) {\n\t\treturn "Max";\n\t}\n\treturn option?.label ?? "Reasoning";\n}\n\n'''
          if ui_marker not in text:
              raise SystemExit("UI helper marker not found")
          text = text.replace(ui_marker, ui_helper + ui_marker, 1)

          old_label = '(EFFORT_LEVELS[effortIndex]?.label ?? "Reasoning");'
          if old_label not in text:
              raise SystemExit("effortLabel marker not found")
          text = text.replace(old_label, 'getEffortLabel(EFFORT_LEVELS[effortIndex], provider);', 1)

          if "{option.label}" not in text:
              raise SystemExit("option label marker not found")
          text = text.replace("{option.label}", "{getEffortLabel(option, provider)}", 1)
          ui.write_text(text, encoding="utf-8")

          print("patched direct DeepSeek: xhigh UI slot -> Max; wire xhigh -> max")
          '@ | Set-Content -Encoding UTF8 patch_cline.py
          python patch_cline.py

      - name: Verify patch source
        shell: bash
        run: |
          grep -n 'withDeepSeekMaxReasoning' cline/sdk/packages/llms/src/providers/vendors/openai-compatible.ts
          grep -n 'reasoning_effort: "max"' cline/sdk/packages/llms/src/providers/vendors/openai-compatible.ts
          grep -n 'return "Max"' cline/apps/examples/desktop-app/webview/components/views/chat/chat-input-bar.tsx

      - name: Install dependencies
        working-directory: cline
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SDK packages
        working-directory: cline
        run: bun run build:sdk

      - name: Build unsigned Windows NSIS installer
        working-directory: cline/apps/examples/desktop-app
        shell: bash
        run: bunx tauri build --bundles nsis

      - name: Collect installer and checksum
        shell: pwsh
        run: |
          $setup = Get-ChildItem "cline/apps/examples/desktop-app/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $setup.FullName "out/Cline_0.0.36_DeepSeekMax_x64-setup.exe"
          $hash = (Get-FileHash "out/Cline_0.0.36_DeepSeekMax_x64-setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Cline_0.0.36_DeepSeekMax_x64-setup.exe" | Set-Content -Encoding ASCII "out/SHA256SUMS.txt"
          Get-ChildItem out | Format-Table Name, Length
          Get-Content out/SHA256SUMS.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Cline-0.0.36-DeepSeekMax-Windows-x64
          path: out/*
          if-no-files-found: error
          retention-days: 7
